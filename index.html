<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MestreRPG</title>
<!-- PWA: abre sem barra do navegador quando instalado na tela inicial -->
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MestreRPG"/>
<meta name="theme-color" content="#0c0b09"/>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
/* ╔═══════════════════════════════════════════════════════════════╗
   ║  ESTILOS — Gerenciador de Campanhas RPG                      ║
   ╠═══════════════════════════════════════════════════════════════╣
   ║  SEÇÕES:                                                     ║
   ║  1. TEMAS        — variáveis CSS por data-theme              ║
   ║  2. BASE         — reset, body, inputs, botões               ║
   ║  3. LAYOUT       — topbar, main, grid                        ║
   ║  4. COMPONENTES  — cards, forms, entry cards, view cards     ║
   ║  5. MODAL        — overlay de confirmação                    ║
   ║  6. MESA MODE    — overlay de jogo, colunas PC               ║
   ║  7. MESA MOBILE  — tab bar, panes (≤900px)                   ║
   ║  8. TOAST / FAB  — notificações e botão flutuante            ║
   ║  9. DRAWER       — menu hamburger                            ║
   ║  10. TEMAS UI    — seletores de tema (topbar + drawer)       ║
   ║  11. ANIMAÇÕES   — keyframes, dice roll                      ║
   ║  12. RESPONSIVO  — ajustes mobile (≤600px)                   ║
   ╚═══════════════════════════════════════════════════════════════╝ */

/* ┌─────────────────────────────────────────────────────────────┐
   │ 1. TEMAS — variáveis CSS por data-theme                    │
   │    paranormal (escuro) | manuscrito (sépia) | vermelho      │
   └─────────────────────────────────────────────────────────────┘ */

/* ── Paranormal (padrão) ── */
:root,[data-theme="paranormal"]{
  --bg:        #0c0b09;
  --bg-alt:    #141210;
  --bg-deep:   #080706;
  --bg-card:   #0f0e0c;
  --bg-input:  #0c0b09;
  --bg-drawer: #111009;
  --bg-mesa-l: #090807;
  --bg-mesa-r: #080706;
  --bg-mesa-top:#0c0b09;
  --bg-tabbar: #0c0b09;
  --border:    #2c2820;
  --border-sub:#302c24;
  --border-dim:#1c1a16;
  --border-deep:#111009;
  --text:      #d6d0c4;
  --text-head: #ede8dc;
  --text-muted:#7a7060;
  --text-dim:  #4a4440;
  --text-tab:  #4a4440;
  --accent:    #c0392b;
  --accent-h:  #a93226;
  --accent-d:  #8e2419;
  --accent-bg: #7f1d1d;
  --accent-lo: rgba(192,57,43,.13);
  --accent-md: rgba(192,57,43,.27);
  --accent-ic: rgba(127,29,29,.13);
  --accent-ic2:rgba(127,29,29,.27);
  --gold:      #b8860b;
  --gold-lo:   rgba(184,134,11,.07);
  --gold-md:   rgba(184,134,11,.20);
  --green:     #276749;
  --green-lo:  rgba(39,103,73,.09);
  --green-text:#4ade80;
  --purple:    #7c3aed;
  --shadow-modal:#000000dd;
  --shadow-drawer:#00000088;
  --shadow-fab:rgba(192,57,43,.33);
  --scrollbar-thumb:#302c24;
  --hero-grad: linear-gradient(135deg,#141210,rgba(127,29,29,.08));
  --form-head-grad: linear-gradient(135deg,#1a1814,rgba(127,29,29,.09));
  --toast-bg:  #1a1814;
  --toast-border:#2c2820;
}

/* ── Manuscrito (sépia / livro antigo) ── */
[data-theme="manuscrito"]{
  --bg:        #2a2318;
  --bg-alt:    #332a1c;
  --bg-deep:   #231c12;
  --bg-card:   #2e2519;
  --bg-input:  #2a2318;
  --bg-drawer: #1e1810;
  --bg-mesa-l: #26200f;
  --bg-mesa-r: #231c12;
  --bg-mesa-top:#26200f;
  --bg-tabbar: #26200f;
  --border:    #5a4a2e;
  --border-sub:#6b5a38;
  --border-dim:#3d3220;
  --border-deep:#2e2515;
  --text:      #e8dcc0;
  --text-head: #f5eed8;
  --text-muted:#9a8a6a;
  --text-dim:  #6b5a38;
  --text-tab:  #6b5a38;
  --accent:    #c0392b;
  --accent-h:  #a93226;
  --accent-d:  #8e2419;
  --accent-bg: #7f1d1d;
  --accent-lo: rgba(192,57,43,.13);
  --accent-md: rgba(192,57,43,.27);
  --accent-ic: rgba(127,29,29,.13);
  --accent-ic2:rgba(127,29,29,.27);
  --gold:      #c8960f;
  --gold-lo:   rgba(200,150,15,.07);
  --gold-md:   rgba(200,150,15,.20);
  --green:     #3a7a52;
  --green-lo:  rgba(58,122,82,.09);
  --green-text:#6dbe8a;
  --purple:    #8b4fc0;
  --shadow-modal:#000000cc;
  --shadow-drawer:#00000066;
  --shadow-fab:rgba(192,57,43,.30);
  --scrollbar-thumb:#5a4a2e;
  --hero-grad: linear-gradient(135deg,#332a1c,rgba(127,29,29,.09));
  --form-head-grad: linear-gradient(135deg,#3a2e1e,rgba(127,29,29,.09));
  --toast-bg:  #332a1c;
  --toast-border:#5a4a2e;
}

/* ── Vermelho (escuro com mais destaque crimson) ── */
[data-theme="vermelho"]{
  --bg:        #0e0809;
  --bg-alt:    #18090b;
  --bg-deep:   #090506;
  --bg-card:   #130709;
  --bg-input:  #0e0809;
  --bg-drawer: #120608;
  --bg-mesa-l: #0c0507;
  --bg-mesa-r: #090506;
  --bg-mesa-top:#0e0809;
  --bg-tabbar: #0e0809;
  --border:    #3d1a1e;
  --border-sub:#4a2024;
  --border-dim:#2a1013;
  --border-deep:#1a080a;
  --text:      #dcc8c8;
  --text-head: #f0dede;
  --text-muted:#8a6060;
  --text-dim:  #5a3a3a;
  --text-tab:  #5a3a3a;
  --accent:    #e0402f;
  --accent-h:  #c03325;
  --accent-d:  #a02a1e;
  --accent-bg: #8b1d1d;
  --accent-lo: rgba(224,64,47,.13);
  --accent-md: rgba(224,64,47,.27);
  --accent-ic: rgba(139,29,29,.13);
  --accent-ic2:rgba(139,29,29,.27);
  --gold:      #c07a2a;
  --gold-lo:   rgba(192,122,42,.07);
  --gold-md:   rgba(192,122,42,.20);
  --green:     #276749;
  --green-lo:  rgba(39,103,73,.09);
  --green-text:#4ade80;
  --purple:    #7c3aed;
  --shadow-modal:#000000ee;
  --shadow-drawer:#00000099;
  --shadow-fab:rgba(224,64,47,.33);
  --scrollbar-thumb:#4a2024;
  --hero-grad: linear-gradient(135deg,#18090b,rgba(139,29,29,.12));
  --form-head-grad: linear-gradient(135deg,#200b0d,rgba(139,29,29,.13));
  --toast-bg:  #18090b;
  --toast-border:#3d1a1e;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono','Courier New',monospace;min-height:100vh;transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-up{animation:fadeUp .3s ease both}.fade-in{animation:fadeIn .2s ease both}
a{color:inherit;text-decoration:none}
input,textarea,select{background:var(--bg-input);border:1px solid var(--border);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:16px;outline:none;padding:12px 14px;border-radius:3px;width:100%;transition:border-color .2s;box-sizing:border-box;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--text-muted)}
textarea{resize:vertical;line-height:1.6;font-size:15px}
select option{background:var(--bg-alt)}
button{cursor:pointer;font-family:'Share Tech Mono',monospace;border:none;outline:none;transition:all .15s}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 2. BASE — reset, body, inputs, botões                      │
   └─────────────────────────────────────────────────────────────┘ */
/* ── Botões ── */
.btn-primary{background:var(--accent);color:#fff;padding:12px 20px;border-radius:3px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;display:inline-flex;align-items:center;gap:8px;min-height:48px;-webkit-tap-highlight-color:transparent}
.btn-primary:hover{background:var(--accent-h)}
.btn-primary:active{background:var(--accent-d);transform:scale(.97)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text-muted);padding:10px 16px;border-radius:3px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;min-height:44px;-webkit-tap-highlight-color:transparent}
.btn-ghost:hover{border-color:var(--text-head);color:var(--text-head)}
.btn-ghost:active{background:var(--bg-alt);transform:scale(.97)}
.btn-del{background:none;border:1px solid transparent;color:var(--text-muted);font-size:16px;width:44px;height:44px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.btn-del:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-ic)}
.btn-del:active{background:var(--accent-ic2);transform:scale(.9)}
.btn-add{background:none;border:1px dashed var(--border-sub);color:var(--text-muted);width:100%;padding:14px;border-radius:3px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;-webkit-tap-highlight-color:transparent}
.btn-add:hover{border-color:var(--green);color:var(--green)}
.btn-add:active{background:var(--green-lo);transform:scale(.98)}
.btn-tab{white-space:nowrap;padding:10px 16px;background:none;border:1px solid var(--border);color:var(--text-muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;flex-shrink:0;min-height:44px;-webkit-tap-highlight-color:transparent}
.btn-tab:hover{border-color:var(--gold);color:var(--gold)}
.btn-tab.active{border-color:var(--accent);color:var(--accent);background:var(--accent-ic)}
.btn-tab:active{transform:scale(.96)}
.btn-green{background:none;border:1px solid var(--green);color:var(--green-text);padding:10px 14px;border-radius:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;min-height:44px;-webkit-tap-highlight-color:transparent}
.btn-green:hover{background:var(--green-lo)}
.btn-green:active{background:var(--green-lo);transform:scale(.97)}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 3. LAYOUT — topbar, main container, hero, stats            │
   └─────────────────────────────────────────────────────────────┘ */
.topbar{border-bottom:1px solid var(--border);padding:0 24px;background:var(--bg-alt);position:sticky;top:0;z-index:50;display:flex;align-items:center;height:54px;gap:14px}
.logo-icon{width:28px;height:28px;border-radius:2px;background:var(--accent-lo);border:1px solid var(--accent-md);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.logo-text{font-family:'Playfair Display',Georgia,serif;font-size:16px;color:var(--text-head);font-weight:700;letter-spacing:.03em}
.main{max-width:920px;margin:0 auto;padding:32px 20px 80px}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 4. COMPONENTES — pills, cards, forms, entry e view cards   │
   └─────────────────────────────────────────────────────────────┘ */
/* ── Pills ── */
.pill{display:inline-block;padding:2px 8px;border-radius:2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}

/* ── CARDS ── */
.campaign-row{background:var(--bg-alt);border:1px solid var(--border);border-radius:3px;padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;margin-bottom:10px;transition:border-color .2s}
.campaign-row:hover{border-color:var(--gold)}
.accent-bar{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0}
.hero{background:var(--hero-grad);border:1px solid var(--border);border-radius:3px;padding:28px;margin-bottom:16px;position:relative;overflow:hidden}
.hero-deco{position:absolute;top:0;right:0;width:120px;height:120px;background:radial-gradient(circle at top right,var(--accent-ic),transparent);pointer-events:none}
.stats-bar{display:flex;gap:24px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-sub);flex-wrap:wrap}
.stat-num{font-size:20px;color:var(--accent);font-weight:700}
.stat-label{font-size:10px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase}

/* ── FORM ── */
.form-wrap{background:var(--bg-alt);border:1px solid var(--border);border-radius:3px;overflow:hidden}
.form-header{padding:20px 24px;border-bottom:1px solid var(--border-sub);background:var(--form-head-grad);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.form-tabs{display:flex;gap:6px;padding:14px 24px;border-bottom:1px solid var(--border-sub);flex-wrap:wrap}
.form-body{padding:24px;max-height:62vh;overflow-y:auto}
.field{margin-bottom:14px}
.field-label{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px;font-weight:700}
.field-hint{font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px;color:var(--border-sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 .span2{grid-column:1/-1}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.grid2 .span2{grid-column:1}}

/* ── ENTRY CARD ── */
.entry-card{border:1px solid var(--border);border-radius:3px;background:var(--bg-alt);margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.entry-card:hover{border-color:var(--gold)}
.entry-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.entry-arrow{color:var(--text-muted);font-size:11px;transition:transform .2s;flex-shrink:0;display:inline-block}
.entry-body{padding:14px;border-top:1px solid var(--border-sub)}

/* ── VIEW CARDS ── */
.npc-card{background:var(--bg-alt);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:3px;padding:16px;margin-bottom:10px}
.loc-card{background:var(--bg-alt);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:3px;padding:16px;margin-bottom:10px}
.item-card{background:var(--bg-alt);border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:3px;padding:16px;margin-bottom:10px}
.sess-card{background:var(--bg-alt);border:1px solid var(--border);border-radius:3px;padding:20px;margin-bottom:12px}
.secret-box{background:var(--accent-ic);border:1px solid var(--accent-ic2);border-radius:2px;padding:8px 12px;margin-top:8px}
.effect-box{background:#1e1b4b;border:1px solid #4c1d9544;border-radius:2px;padding:8px 12px;margin-top:8px}
.note-box{margin-top:12px;padding:10px 14px;background:var(--gold-lo);border:1px solid var(--gold-md);border-radius:2px}
.session-num{width:42px;height:42px;border-radius:2px;background:var(--accent-lo);border:1px solid var(--accent-md);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:15px;font-weight:700;flex-shrink:0}
.section-divider{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-divider::after{content:'';flex:1;height:1px;background:var(--border-sub)}
.empty-state{text-align:center;padding:40px 0;color:var(--text-muted);font-size:13px;border:1px dashed var(--border-sub);border-radius:3px}
.empty-big{text-align:center;padding:64px 24px;border:1px dashed var(--border-sub);border-radius:3px}
.body-text{color:var(--text);font-size:13px;line-height:1.7;font-family:Georgia,serif}
.serif{font-family:'Playfair Display',Georgia,serif}
.ink{color:var(--text-head)}
.muted{color:var(--text-muted)}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 5. MODAL — overlay de confirmação de exclusão              │
   └─────────────────────────────────────────────────────────────┘ */
.modal-bg{position:fixed;inset:0;background:var(--shadow-modal);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--bg-alt);border:1px solid var(--accent);border-radius:4px;padding:28px;max-width:400px;width:100%;text-align:center}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 6. MESA MODE — overlay de jogo, layout 2 colunas (PC)     │
   └─────────────────────────────────────────────────────────────┘ */
.mesa-overlay{position:fixed;inset:0;background:var(--bg-deep);z-index:300;display:flex;flex-direction:column;overflow:hidden}
.mesa-top{background:var(--bg-mesa-top);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0;flex-wrap:wrap}

/* PC: two-column layout */
.mesa-body{flex:1;display:flex;overflow:hidden;min-height:0}

/* LEFT: fixed-width control panel, independently scrollable */
.mesa-col-left{width:340px;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--border-dim);background:var(--bg-mesa-l)}
.mesa-col-left-inner{padding:14px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.mesa-col-left-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--border-sub);font-weight:700;padding:8px 14px 4px;border-bottom:1px solid var(--border-deep);margin-bottom:2px;flex-shrink:0}

/* RIGHT: main content, independently scrollable */
.mesa-col-right{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 28px;min-width:0;background:var(--bg-mesa-r)}
.mesa-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:1400px){.mesa-grid{grid-template-columns:1fr 1fr 1fr}}

/* hide mobile-only elements on PC */
.mob-tab-pane{display:none}
.mesa-mob-tabbar{display:none}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 7. MESA MOBILE — tab bar e panes (≤900px)                  │
   └─────────────────────────────────────────────────────────────┘ */
@media(max-width:900px){
  .mesa-body{flex-direction:column;overflow:hidden;position:relative}
  .mesa-col-left,.mesa-col-right{
    position:absolute;inset:0;bottom:0;
    overflow-y:auto;overflow-x:hidden;
    border:none;background:var(--bg-deep);
    display:none;
    padding-bottom:72px;
  }
  .mesa-col-left.mob-active,.mesa-col-right.mob-active{display:block}
  .mesa-col-left-inner{padding:14px;gap:14px}
  .mesa-grid{grid-template-columns:1fr}
  .mesa-col-left-label{display:none}

  .mob-tab-pane{
    position:absolute;inset:0;bottom:0;
    overflow-y:auto;overflow-x:hidden;
    padding:14px 14px 80px;
    display:none;
    background:var(--bg-deep);
  }
  .mob-tab-pane.mob-active{display:block}

  .mesa-mob-tabbar{
    position:absolute;bottom:0;left:0;right:0;
    height:60px;
    background:var(--bg-tabbar);
    border-top:1px solid var(--border-dim);
    display:flex;
    z-index:10;
  }
  .mesa-mob-tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;border:none;background:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    color:var(--text-tab);transition:color .15s;padding:0;
    position:relative;
  }
  .mesa-mob-tab.active{color:var(--accent)}
  .mesa-mob-tab.active::after{
    content:'';position:absolute;top:0;left:20%;right:20%;
    height:2px;background:var(--accent);border-radius:0 0 2px 2px;
  }
  .mesa-mob-tab-icon{font-size:20px;line-height:1}
  .mesa-mob-tab-label{font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-family:'Share Tech Mono',monospace;font-weight:700}

  .mesa-col-left,.mesa-col-right{display:none!important}
}
.mesa-card{background:var(--bg-card);border:1px solid var(--border);border-radius:3px;padding:16px}
.mesa-card-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.mesa-card-title::after{content:'';flex:1;height:1px;background:var(--border-sub)}
.mesa-pista{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-sub);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pista-check{width:28px;height:28px;border:2px solid var(--border-sub);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;margin-top:1px}
.pista-check.done{background:var(--green);border-color:var(--green);color:#fff}
.sess-status-btn{padding:8px 14px;border-radius:3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border:1px solid;cursor:pointer;background:none;font-family:'Share Tech Mono',monospace;min-height:40px;-webkit-tap-highlight-color:transparent}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 8. TOAST / FAB — notificações e botão flutuante            │
   └─────────────────────────────────────────────────────────────┘ */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:2px;font-size:12px;z-index:999;animation:fadeIn .2s ease;white-space:nowrap;pointer-events:none;background:var(--toast-bg);border:1px solid var(--toast-border);color:var(--text)}

/* ── FAB (Floating Action Button) ── */
.fab{position:fixed;bottom:24px;right:20px;z-index:90;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px var(--shadow-fab);cursor:pointer;transition:transform .15s,background .2s}
.fab:hover,.fab:active{background:var(--accent-h);transform:scale(1.08)}
@media(min-width:700px){.fab{display:none}}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 9. DRAWER — menu hamburger lateral                         │
   └─────────────────────────────────────────────────────────────┘ */
.drawer-overlay{position:fixed;inset:0;background:var(--shadow-drawer);z-index:150;display:none}
.drawer-overlay.open{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--bg-drawer);border-right:1px solid var(--border);z-index:160;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer-item{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border-dim);cursor:pointer;color:var(--text);font-size:15px;letter-spacing:.02em;transition:background .15s;min-height:56px;-webkit-tap-highlight-color:transparent}
.drawer-item:hover,.drawer-item:active{background:var(--bg-alt)}
.drawer-item .di-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.drawer-item .di-badge{margin-left:auto;background:var(--accent-lo);border:1px solid var(--accent-md);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:2px;letter-spacing:.06em;text-transform:uppercase}
.hamburger-btn{background:none;border:none;color:var(--text-muted);padding:8px;display:none;flex-direction:column;gap:5px;cursor:pointer;min-width:44px;min-height:44px;align-items:center;justify-content:center}
.hamburger-btn span{display:block;width:22px;height:2px;background:currentColor;border-radius:1px;transition:all .2s}
@media(max-width:699px){.hamburger-btn{display:flex}}

/* ── MOBILE TABS — horizontal scroll, no wrap ── */
.form-tabs{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border-sub);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.form-tabs::-webkit-scrollbar{display:none}
.detail-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.detail-tabs::-webkit-scrollbar{display:none}
.btn-tab{white-space:nowrap;padding:8px 14px;background:none;border:1px solid var(--border);color:var(--text-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;flex-shrink:0}
.btn-tab:hover{border-color:var(--gold);color:var(--gold)}
.btn-tab.active{border-color:var(--accent);color:var(--accent);background:var(--accent-ic)}

/* ── MESA SWIPE ── */
.mesa-swipe-wrap{position:relative;overflow:hidden;touch-action:pan-y}
.mesa-swipe-hint{position:absolute;top:50%;transform:translateY(-50%);background:var(--bg-alt);border:1px solid var(--border);border-radius:2px;padding:4px 10px;font-size:11px;color:var(--text-muted);pointer-events:none;opacity:0;transition:opacity .2s;z-index:10}
.mesa-swipe-hint.left{left:8px}
.mesa-swipe-hint.right{right:8px}
.mesa-swipe-hint.show{opacity:1}
.mesa-sess-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg-mesa-top);border-bottom:1px solid var(--border-dim);flex-shrink:0}
.mesa-nav-btn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:6px 14px;border-radius:2px;font-size:12px;cursor:pointer;font-family:'Share Tech Mono',monospace;transition:all .15s}
.mesa-nav-btn:hover:not(:disabled){border-color:var(--text-head);color:var(--text-head)}
.mesa-nav-btn:disabled{opacity:.3;cursor:not-allowed}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 10. TEMAS UI — seletores de tema (drawer + topbar)        │
   └─────────────────────────────────────────────────────────────┘ */
.theme-btn{
  display:flex;align-items:center;gap:8px;width:100%;padding:10px 16px;
  border:none;border-radius:3px;background:none;cursor:pointer;
  font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--text);
  transition:background .15s;-webkit-tap-highlight-color:transparent;
}
.theme-btn:hover{background:var(--bg-alt)}
.theme-btn.active-theme{color:var(--accent);font-weight:700}
.theme-swatch{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 11. ANIMAÇÕES — keyframes e efeitos de dado               │
   └─────────────────────────────────────────────────────────────┘ */
/* ── Dice Roll ── */
/* (keyframes diceRoll abaixo) */

/* ┌─────────────────────────────────────────────────────────────┐
   │ 12. RESPONSIVO — ajustes mobile hero (≤600px)              │
   └─────────────────────────────────────────────────────────────┘ */

  .hero-actions .btn-ghost,.hero-actions .btn-primary{width:100%;justify-content:center}
  input,select{font-size:16px;padding:13px 14px}
  textarea{font-size:15px;padding:12px 14px}
  .field{margin-bottom:18px}

/* ── Topbar (PC only) ── */
.topbar-theme{display:flex;align-items:center;gap:5px;margin-left:8px}

.topbar-theme-btn span{display:block;width:16px;height:16px;border-radius:50%;border:2px solid;transition:transform .15s,box-shadow .15s}

@keyframes diceRoll{0%{transform:scale(.6) rotate(-15deg);opacity:.3}60%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}

.dice-btn:hover{border-color:var(--gold);background:var(--gold-lo)}
.dice-btn:active{transform:scale(.92);background:var(--gold-md)}

</style>
</head>

<script>
/* ╔═══════════════════════════════════════════════════════════════╗
   ║  ORDEM PARANORMAL — Organizador de Campanhas                 ║
   ║  Arquivo único (single-file app) — localStorage persistence  ║
   ╠═══════════════════════════════════════════════════════════════╣
   ║  MÓDULOS (ordem de declaração):                              ║
   ║  1.  TEMA          — variáveis de tema, applyTheme/setTheme  ║
   ║  2.  STORAGE       — KEY, persist, uid, esc, nl, backup      ║
   ║  3.  ESTADO GLOBAL — variáveis de view e mesa                ║
   ║  4.  CONSTANTES    — cores, tipos, ícones de domínio         ║
   ║  5.  MODELOS       — blank*() factories + schema             ║
   ║  6.  UI HELPERS    — pills, fieldHtml                        ║
   ║  7.  RENDER ENGINE — render(), updateTopbar()                ║
   ║  8.  VIEW: LIST    — renderList(), bindList()                ║
   ║  9.  VIEW: FORM    — renderForm(), renderEntryCard()         ║
   ║  10. VIEW: DETAIL  — renderDetail()                          ║
   ║  11. MESA: CORE    — openMesa, closeMesa, renderMesa         ║
   ║  12. MESA: AGENTES — tracker de PV/PE/SAN/NEX/condições      ║
   ║  13. MESA: COMBATE — iniciativa, criaturas                   ║
   ║  14. MESA: DADOS   — rolador de dados, histórico             ║
   ║  15. MESA: PISTAS  — clues toggle                           ║
   ║  16. MESA: UI      — toggle, swipe, busca, tab bar           ║
   ║  17. TIMER         — cronômetro de sessão                    ║
   ║  18. NAVIGATION    — goList, goCreate, goDetail...           ║
   ║  19. FORM OPS      — saveForm, saveFormState, syncSessions   ║
   ║  20. ENTRY OPS     — addEntry, delEntry, scene/clue ops      ║
   ║  21. MODAL/DELETE  — askDelete, confirmDelete                ║
   ║  22. IMPORT/EXPORT — JSON, PDF                               ║
   ║  23. DRAWER / UI   — openDrawer, showToast                   ║
   ║  24. INIT          — render() inicial                        ║
   ╚═══════════════════════════════════════════════════════════════╝ */

/* ┌─────────────────────────────────────────────────────────────┐
   │ 1. TEMA                                                     │
   └─────────────────────────────────────────────────────────────┘ */
const THEME_KEY = 'op_theme';
const THEMES = ['paranormal','manuscrito','vermelho'];

function applyTheme(t) {
  if (!THEMES.includes(t)) t = 'paranormal';
  document.documentElement.setAttribute('data-theme', t);
  THEMES.forEach(th => {
    const btn = document.getElementById('theme-btn-'+th);
    if (btn) btn.classList.toggle('active-theme', th === t);
    const tt = document.getElementById('tt-'+th);
    if (tt) tt.classList.toggle('tt-active', th === t);
  });
}
function setTheme(t) {
  localStorage.setItem(THEME_KEY, t);
  applyTheme(t);
  showToast('Tema ' + {paranormal:'Paranormal',manuscrito:'Manuscrito',vermelho:'Vermelho'}[t] + ' aplicado');
}
// apply saved theme immediately on load
applyTheme(localStorage.getItem(THEME_KEY) || 'paranormal');

/* ┌─────────────────────────────────────────────────────────────┐
   │ 2. STORAGE — persistência e utilitários de string           │
   └─────────────────────────────────────────────────────────────┘ */
const KEY = 'op_v3';
let camps = [];
try { camps = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) { camps = []; }

/* ┌─────────────────────────────────────────────────────────────┐
   │ 3. ESTADO GLOBAL — view e controle de mesa                  │
   └─────────────────────────────────────────────────────────────┘ */
let view = 'list';      // 'list' | 'form' | 'detail'
let viewingId = null;   // id da campanha sendo visualizada
let editingId = null;   // id da campanha sendo editada (null = nova)
let delTargetId = null;
let formData = null;    // rascunho em edição
let activeFormTab = 'info';
let activeDetailTab = 'overview';

// Mesa Mode
let mesaSessionId = null;
let mesaCenaAtivaId = null; // cena marcada como atual
let mesaBusca = '';         // filtro de pesquisa em tempo real

// Timer de sessão (módulo 17)
let _timerInterval = null;
let _timerStart = null;
let _timerRunning = false;
let _timerAlerts = { 30: false, 15: false, 5: false }; // minutos restantes para alertar

/* ┌─────────────────────────────────────────────────────────────┐
   │ 17. TIMER — cronômetro de sessão com alertas               │
   └─────────────────────────────────────────────────────────────┘ */
function timerStart() {
  if (_timerRunning) return;
  _timerStart = Date.now() - (_timerStart ? Date.now() - _timerStart : 0);
  if (!_timerStart) _timerStart = Date.now();
  _timerRunning = true;
  _timerInterval = setInterval(timerTick, 1000);
  timerTick();
}
function timerPause() {
  if (!_timerRunning) return;
  _timerRunning = false;
  clearInterval(_timerInterval);
  // save elapsed so resume works
  _timerStart = Date.now() - timerElapsed();
}
function timerReset() {
  clearInterval(_timerInterval);
  _timerRunning = false;
  _timerStart = null;
  _timerAlerts = { 30: false, 15: false, 5: false };
  const el = document.getElementById('mesa-timer');
  if (el) { el.textContent = '00:00'; el.style.color = '#7a7060'; }
  const btn = document.getElementById('mesa-timer-btn');
  if (btn) btn.textContent = '▶';
}
function timerElapsed() {
  if (!_timerStart) return 0;
  return Date.now() - _timerStart;
}
function timerToggle() {
  if (_timerRunning) { timerPause(); document.getElementById('mesa-timer-btn').textContent='▶'; }
  else { timerStart(); document.getElementById('mesa-timer-btn').textContent='⏸'; }
}
function timerTick() {
  const ms = timerElapsed();
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const display = h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const el = document.getElementById('mesa-timer');
  if (!el) { clearInterval(_timerInterval); return; }
  el.textContent = display;
  // alert coloring — remaining from 4h session default
  const SESSION_MIN = 240;
  const elapsed_min = Math.floor(totalSec / 60);
  const remaining = SESSION_MIN - elapsed_min;
  if (remaining <= 5 && !_timerAlerts[5]) {
    _timerAlerts[5] = true; el.style.color='#c0392b';
    showToast('⏰ Menos de 5 minutos de sessão!','err');
  } else if (remaining <= 15 && !_timerAlerts[15]) {
    _timerAlerts[15] = true; el.style.color='#e65c00';
    showToast('⏰ 15 minutos restantes de sessão');
  } else if (remaining <= 30 && !_timerAlerts[30]) {
    _timerAlerts[30] = true; el.style.color='#b8860b';
    showToast('⏰ 30 minutos restantes de sessão');
  } else if (remaining > 30) {
    el.style.color = '#4ade80';
  }
}

const BACKUP_KEY = 'op_backup_ts';

// Utilitários de string
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(t) { return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl(t)  { return esc(t).replace(/\n/g,'<br>'); }

// Backup rápido
function getBackupAge() {
  const ts = parseInt(localStorage.getItem(BACKUP_KEY)||'0');
  if (!ts) return null;
  return Math.floor((Date.now() - ts) / 86400000); // dias
}
function doBackup() {
  const blob = new Blob([JSON.stringify(camps,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'op-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  localStorage.setItem(BACKUP_KEY, Date.now().toString());
  updateBackupBadge();
  showToast('Backup salvo!');
}
function updateBackupBadge() {
  const el = document.getElementById('backup-badge');
  if (!el) return;
  const days = getBackupAge();
  if (days === null) {
    el.textContent = 'Nunca'; el.style.background='#c0392b22'; el.style.color='#c0392b';
  } else if (days >= 7) {
    el.textContent = days+'d atrás'; el.style.background='#c0392b22'; el.style.color='#c0392b';
  } else if (days >= 3) {
    el.textContent = days+'d atrás'; el.style.background='#b8860b22'; el.style.color='#b8860b';
  } else {
    el.textContent = days===0?'Hoje':days+'d atrás'; el.style.background='#27674922'; el.style.color='#4ade80';
  }
}

function render() {
  const main = document.getElementById('main');
  updateTopbar();
  updateDrawerItems();
  if (view === 'list')   { main.innerHTML = renderList();   main.className='main fade-up'; bindList(); }
  if (view === 'form')   { main.innerHTML = renderForm();   main.className='main fade-up'; bindForm(); }
  if (view === 'detail') { main.innerHTML = renderDetail(); main.className='main fade-up'; bindDetail(); }
}

function updateTopbar() {
  const c = camps.find(x=>x.id===viewingId);
  document.getElementById('topbar-count').textContent = camps.length + ' campanha' + (camps.length!==1?'s':'');
  const sep = document.getElementById('bc-sep');
  const cur = document.getElementById('bc-current');
  if (view !== 'list' && c) {
    sep.style.display='inline'; cur.style.display='inline';
    cur.textContent = view==='form' ? (editingId?'Editando':'Nova Campanha') : c.title||'Campanha';
  } else if (view === 'form' && !editingId) {
    sep.style.display='inline'; cur.style.display='inline'; cur.textContent='Nova Campanha';
  } else {
    sep.style.display='none'; cur.style.display='none';
  }
}

function renderEntryCard(type, entry, idx) {
  const id = entry.id;
  let title='', subtitle='', badge='', body='';

  if (type==='npc') {
    title=entry.name; subtitle=entry.role;
    body = `<div class="grid2">
      ${fieldHtml('Nome','<input value="'+esc(entry.name)+'" oninput="setEntryField(\'npcs\',\''+id+'\',\'name\',this.value)"/>')}
      ${fieldHtml('Papel / Tipo','<input value="'+esc(entry.role)+'" oninput="setEntryField(\'npcs\',\''+id+'\',\'role\',this.value)" placeholder="Ex: Cultista, Entidade, Informante"/>')}
      <div class="span2">${fieldHtml('Descrição','<textarea rows="3" oninput="setEntryField(\'npcs\',\''+id+'\',\'description\',this.value)" placeholder="Aparência, personalidade, como age...">'+esc(entry.description)+'</textarea>')}</div>
      <div class="span2">${fieldHtml('Rituais / Habilidades Paranormais','<textarea rows="3" oninput="setEntryField(\'npcs\',\''+id+'\',\'rituals\',this.value)" placeholder="Poderes, rituais, ataques especiais, fraquezas...">'+esc(entry.rituals||'')+'</textarea>')}</div>
      <div class="span2">${fieldHtml('Segredo / Motivação Oculta','<textarea rows="2" oninput="setEntryField(\'npcs\',\''+id+'\',\'secret\',this.value)" placeholder="O que esse NPC esconde? Qual seu real objetivo?">'+esc(entry.secret)+'</textarea>','(só o mestre vê)')}</div>
      ${fieldHtml('Impacto na Sanidade','<input value="'+esc(entry.sanity||'')+'" oninput="setEntryField(\'npcs\',\''+id+'\',\'sanity\',this.value)" placeholder="Ex: -1d4 SAN ao ver, -2 SAN por turno"/>')}
    </div>`;
  }
  if (type==='loc') {
    title=entry.name; subtitle=entry.type; badge=dangerPill(entry.danger);
    body = `<div class="grid2">
      ${fieldHtml('Nome','<input value="'+esc(entry.name)+'" oninput="setEntryField(\'locations\',\''+id+'\',\'name\',this.value)" placeholder="Ex: Fábrica Abandonada"/>')}
      ${fieldHtml('Tipo','<input value="'+esc(entry.type)+'" oninput="setEntryField(\'locations\',\''+id+'\',\'type\',this.value)" placeholder="Ex: Urbano, Outro Lado"/>')}
      <div class="span2">${fieldHtml('Descrição','<textarea rows="3" oninput="setEntryField(\'locations\',\''+id+'\',\'description\',this.value)" placeholder="Ambiente, atmosfera...">'+esc(entry.description)+'</textarea>')}</div>
      ${fieldHtml('Nível de Perigo','<select onchange="setEntryField(\'locations\',\''+id+'\',\'danger\',this.value)">'+['Baixo','Médio','Alto','Extremo'].map(d=>`<option${d===entry.danger?' selected':''}>${d}</option>`).join('')+'</select>')}
    </div>`;
  }
  if (type==='item') {
    title=entry.name; subtitle=entry.type;
    body = `<div class="grid2">
      ${fieldHtml('Nome','<input value="'+esc(entry.name)+'" oninput="setEntryField(\'items\',\''+id+'\',\'name\',this.value)" placeholder="Ex: Espelho de Madalena"/>')}
      ${fieldHtml('Tipo','<input value="'+esc(entry.type)+'" oninput="setEntryField(\'items\',\''+id+'\',\'type\',this.value)" placeholder="Ex: Artefato, Pista, Ritual"/>')}
      <div class="span2">${fieldHtml('Descrição','<textarea rows="2" oninput="setEntryField(\'items\',\''+id+'\',\'description\',this.value)" placeholder="Aparência, origem...">'+esc(entry.description)+'</textarea>')}</div>
      <div class="span2">${fieldHtml('Efeito / Significado','<textarea rows="2" oninput="setEntryField(\'items\',\''+id+'\',\'effect\',this.value)" placeholder="O que esse item faz ou revela?">'+esc(entry.effect)+'</textarea>')}</div>
    </div>`;
  }

  const typeMap = {npc:'npcs', loc:'locations', item:'items'};
  const open = idx === 0;
  return `
    <div class="entry-card" id="ec-${id}">
      <div class="entry-head" onclick="toggleEntry('eb-${id}','ea-${id}')">
        <span class="entry-arrow" id="ea-${id}" style="transform:${open?'rotate(90deg)':'rotate(0)'}">▶</span>
        <div style="flex:1;min-width:0">
          <div style="color:#ede8dc;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)||'<em style="color:#7a7060">Sem nome</em>'}</div>
          ${subtitle?`<div style="color:#7a7060;font-size:11px;margin-top:2px">${esc(subtitle)}</div>`:''}
        </div>
        ${badge}
        <button class="btn-del" onclick="event.stopPropagation();delEntry('${typeMap[type]}','${id}')">✕</button>
      </div>
      <div class="entry-body" id="eb-${id}" style="display:${open?'block':'none'}">${body}</div>
    </div>`;
}

function bindForm() {
  // live title update
  const tf = document.getElementById('f-title');
  if (tf) tf.addEventListener('input', e => {
    formData.title = e.target.value;
    document.querySelector('.form-header .serif').textContent = formData.title || 'Sem título';
  });
  // scroll focused input into view when keyboard opens on mobile
  document.querySelectorAll('.form-body input, .form-body textarea, .form-body select').forEach(el => {
    el.addEventListener('focus', () => {
      setTimeout(() => el.scrollIntoView({behavior:'smooth', block:'center'}), 300);
    });
  });
}

function openMesa(sessId) {
  mesaSessionId = sessId;
  iniciativaRodada = 1;
  renderMesa();
  document.getElementById('mesa-overlay').style.display='flex';
  initMesaSwipe();
}
function closeMesa() {
  timerReset();
  document.getElementById('mesa-overlay').style.display='none';
  mesaSessionId = null;
  mesaCenaAtivaId = null;
  mesaBusca = '';
  render();
}
function mesaNavSession(dir) {
  const c = camps.find(x=>x.id===viewingId);
  if (!c) return;
  const idx = c.sessions_data.findIndex(x=>x.id===mesaSessionId);
  const next = c.sessions_data[idx+dir];
  if (!next) return;
  mesaSessionId = next.id;
  renderMesa();
}

   │ 16. MESA: UI — tab bar, toggle, swipe, busca, marcador     │

let _mobActiveTab = 'cena';
function mesaMobTab(tab, btn) {
  _mobActiveTab = tab;
  document.querySelectorAll('.mob-tab-pane').forEach(p => p.classList.remove('mob-active'));
  const pane = document.getElementById('mob-pane-'+tab);
  if (pane) pane.classList.add('mob-active');
  document.querySelectorAll('.mesa-mob-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (tab === 'agentes') renderAgentesTracker();
  if (tab === 'combate') renderIniciativa();
  if (tab === 'dados') renderDiceLog();
}

// helper: returns the active element with a given ID.
// On mobile, prefers elements inside the active mob-tab-pane.
// On PC, falls back to document.getElementById (PC columns are always visible).
function mesaEl(id) {
  const isMob = window.innerWidth <= 900;
  if (isMob) {
    const panes = document.querySelectorAll('.mob-tab-pane.mob-active');
    for (const p of panes) {
      const el = p.querySelector('#'+id);
      if (el) return el;
    }
    // fallback: any pane (element might not be in the active one yet)
    const anyPane = document.querySelector('.mob-tab-pane #'+id);
    if (anyPane) return anyPane;
  }
  return document.getElementById(id);
}

// ── Toggle expandable sections in Mesa ────────────────────────
function mesaMarcarCena(scId) {
  mesaCenaAtivaId = mesaCenaAtivaId === scId ? null : scId;
  // re-render just the cenas section without full renderMesa
  const containers = document.querySelectorAll('.mesa-cenas-list');
  containers.forEach(c => {

      const id = row.dataset.scid;
      const isAtiva = id === mesaCenaAtivaId;

    });
    // move active to top
    if (mesaCenaAtivaId) {
      const ativa = c.querySelector(`[data-scid="${mesaCenaAtivaId}"]`);

}
function mesaBuscarFiltro(val) {
  mesaBusca = val.toLowerCase().trim();
  const containers = document.querySelectorAll('.mesa-busca-container');
  containers.forEach(cont => {
    const items = cont.querySelectorAll('[data-busca]');
    items.forEach(item => {
      const texto = item.dataset.busca || '';
      item.style.display = (!mesaBusca || texto.includes(mesaBusca)) ? '' : 'none';
    });

}

function mesaToggle(id) {
  const el  = document.getElementById(id);
  const arr = document.getElementById('arr-'+id);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display  = open ? 'none' : 'block';
  if (arr) arr.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
}
function initMesaSwipe() {
  const el = document.getElementById('mesa-overlay');
  let startX=0, startY=0, moved=false;
  el.addEventListener('touchstart', e=>{
    startX=e.touches[0].clientX; startY=e.touches[0].clientY; moved=false;
  },{passive:true});
  el.addEventListener('touchmove', e=>{
    const dx=Math.abs(e.touches[0].clientX-startX);
    const dy=Math.abs(e.touches[0].clientY-startY);
    if(dx>dy&&dx>20) moved=true;
  },{passive:true});
  el.addEventListener('touchend', e=>{
    if(!moved) return;
    const dx=e.changedTouches[0].clientX-startX;
    if(Math.abs(dx)<60) return;
    // swipe left = next, swipe right = prev
    mesaNavSession(dx<0?1:-1);
  },{passive:true});
}

function mesaSaveQuicknotes(val) {
  const c = camps.find(x=>x.id===viewingId);
  const s = c?.sessions_data.find(x=>x.id===mesaSessionId);
  if (!s) return;
  s.quicknotes = val;

}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 14. MESA: DADOS — rolador e histórico de dados             │
   └─────────────────────────────────────────────────────────────┘ */
const diceLog = [];
function rollDice(faces) {
  const result = Math.floor(Math.random() * faces) + 1;
  const el = mesaEl('dice-result');
  const labelEl = mesaEl('dice-label');
  if (!el || !labelEl) return;
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = 'diceRoll .35s ease';
  el.textContent = result;
  labelEl.textContent = 'd' + faces;
  const isCrit = result === faces;
  const isFail = result === 1;
  el.style.color = isCrit ? '#4ade80' : isFail ? '#c0392b' : '#ede8dc';
  diceLog.unshift({ faces, result, isCrit, isFail });
  if (diceLog.length > 10) diceLog.pop();
  renderDiceLog();
}
function rollCustomDice() {
  const input = mesaEl('dice-custom');
  if (!input) return;
  const faces = parseInt(input.value);
  if (!faces || faces < 2 || faces > 9999) { showToast('Valor inválido (2–9999).','err'); return; }
  rollDice(faces);
}
function renderDiceLog() {
  // update all visible dice-log elements (PC + mobile)
  document.querySelectorAll('#dice-log').forEach(el => {
    if (diceLog.length === 0) return;
    el.innerHTML = diceLog.map((e,i) => {
      const c = e.isCrit ? '#4ade80' : e.isFail ? '#c0392b' : '#7a7060';
      const tag = e.isCrit ? ' ★' : e.isFail ? ' ✕' : '';
      return `<span style="color:${c};font-size:11px;opacity:${1 - i*0.08}" title="d${e.faces}">d${e.faces}·<b>${e.result}</b>${tag}</span>`;
    }).join('<span style="color:#1c1a16;margin:0 2px">│</span>');
  });
}

   │ 12. MESA: AGENTES — PV / PE / SAN / NEX / condições       │
   └─────────────────────────────────────────────────────────────┘ */
function mesaAddAgente() {
  const c = camps.find(x=>x.id===viewingId);
  if (!c) return;
  if (!c.agentes) c.agentes = [];
  c.agentes.push(blankAgente());
  persist();
  renderSanTracker();
}
function mesaDelAgente(id) {
  const c = camps.find(x=>x.id===viewingId);
  if (!c) return;
  c.agentes = (c.agentes||[]).filter(a=>a.id!==id);
  persist();
  renderSanTracker();
}
function mesaSetAgente(id, field, val) {
  const c = camps.find(x=>x.id===viewingId);
  const a = (c?.agentes||[]).find(x=>x.id===id);
  if (!a) return;
  const numFields = ['san','sanMax','pv','pvMax','pe','peMax','nex'];
  if (numFields.includes(field)) {
    const n = parseInt(val);
    a[field] = isNaN(n) ? 0 : Math.max(0, n);
  } else {
    a[field] = val;
  }
  persist();
  if (numFields.includes(field) || field === 'icon') renderAgentesTracker();
}
function mesaDelta(id, stat, delta) {
  const c = camps.find(x=>x.id===viewingId);
  const a = (c?.agentes||[]).find(x=>x.id===id);
  if (!a) return;
  const maxKey = stat + 'Max';
  a[stat] = Math.max(0, Math.min(a[maxKey]||0, (a[stat]||0) + delta));
  persist();
  renderAgentesTracker();
}
// keep old name as alias so any stale inline calls don't break
function mesaSanDelta(id, delta) { mesaDelta(id, 'san', delta); }

function mesaToggleCondicao(id, cond) {
  const c = camps.find(x=>x.id===viewingId);
  const a = (c?.agentes||[]).find(x=>x.id===id);
  if (!a) return;
  if (!a.conditions) a.conditions = [];
  const idx = a.conditions.indexOf(cond);
  if (idx === -1) a.conditions.push(cond);
  else a.conditions.splice(idx, 1);
  persist();
  renderAgentesTracker();
}

        <div style="border-top:1px solid #2c2820;margin:10px 0"></div>` : ''}

function mesaDeltaCriatura(id, delta) {

function mesaSetIniciativaCriatura(id, val) {

function renderIniciativa() {
  const c = camps.find(x=>x.id===viewingId);
  const el = mesaEl('iniciativa-body');
  if (!el || !c) return;
  const agentes = c.agentes || [];
  const criaturas = getCriaturas();
  // combatentes unificados: agentes (tipo 'ag') + criaturas (tipo 'cr')
  const todos = [
    ...agentes.map(a => ({...a, _tipo:'ag'})),
    ...criaturas.map(cr => ({...cr, _tipo:'cr'}))
  ];
  const sess = c.sessions_data.find(x=>x.id===mesaSessionId);
  const combateAtivo = todos.some(x => x._ini != null);
  const sorted = [...todos].sort((a,b) => {
    if (a._ini==null && b._ini==null) return 0;
    if (a._ini==null) return 1;
    if (b._ini==null) return -1;
    return b._ini - a._ini;
  });
  const turnIdx = (combateAtivo && sess?._iniTurn != null) ? sess._iniTurn : 0;

  function iniRow(x, i) {
    const isAg = x._tipo === 'ag';
    const isActive = combateAtivo && i === turnIdx && x._ini != null;
    const isDead = (x.conditions||[]).includes('morto');
    const condTags = (x.conditions||[]).filter(v=>v!=='morto').map(v=>{
      const cd = CONDICOES.find(c=>c.v===v);
      return cd ? `<span style="font-size:9px;padding:1px 4px;border-radius:2px;background:${cd.c}22;border:1px solid ${cd.c}44;color:${cd.c}">${cd.ic}</span>` : '';
    }).join('');
    const pvPct = x.pvMax > 0 ? Math.round((x.pv/x.pvMax)*100) : 0;
    const pvC = pvPct > 50 ? '#276749' : pvPct > 25 ? '#b8860b' : '#c0392b';
    const borderColor = isActive ? '#c0392b66' : isAg ? '#1c1a16' : '#4c1d9533';
    const bg = isActive ? '#7f1d1d22' : isAg ? '#060504' : '#0a0408';
    return `<div style="border-radius:3px;margin-bottom:4px;background:${bg};border:1px solid ${borderColor};transition:all .2s;opacity:${isDead?'.35':'1'}">
      <div style="display:flex;align-items:center;gap:8px;padding:7px 10px">
        <span style="font-size:${isAg?'17':'14'}px;flex-shrink:0">${isAg?(x.icon||'❤️'):'💀'}</span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
            ${isAg
              ? `<span style="font-size:13px;font-weight:700;color:${isActive?'#ede8dc':'#9a9088'};font-family:'Playfair Display',Georgia,serif">${esc(x.name||'Agente')}</span>`
              : `<input value="${esc(x.name)}" onchange="mesaSetCriatura('${x.id}','name',this.value)"
                  style="background:transparent;border:none;border-bottom:1px solid #4c1d9533;color:${isActive?'#ede8dc':'#c4b5fd'};font-size:13px;font-weight:700;font-family:'Playfair Display',Georgia,serif;padding:0;width:auto;min-width:80px"/>`
            }
            <span style="font-size:9px;padding:1px 5px;border-radius:2px;background:${isAg?'#276749':'#4c1d95'}22;border:1px solid ${isAg?'#276749':'#4c1d95'}44;color:${isAg?'#4ade80':'#a78bfa'};text-transform:uppercase;letter-spacing:.06em">${isAg?'agente':'inimigo'}</span>
            ${condTags}
            ${isDead?`<span style="font-size:9px;color:#4a4440;border:1px solid #302c24;padding:1px 4px;border-radius:2px">☠ morto</span>`:''}
          </div>
          ${!isAg?`<div style="display:flex;align-items:center;gap:4px;margin-top:4px">
            <div style="flex:1;height:4px;background:#1c1a16;border-radius:2px;overflow:hidden">
              <div style="height:100%;width:${pvPct}%;background:${pvC};border-radius:2px;transition:width .2s"></div>
            </div>
            <button onclick="mesaDeltaCriatura('${x.id}',-1)" style="background:none;border:1px solid #c0392b44;color:#c0392b;width:20px;height:20px;border-radius:2px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent">−</button>
            <input type="number" value="${x.pv}" onchange="mesaSetCriatura('${x.id}','pv',this.value)" style="width:32px;text-align:center;background:#0c0b09;border:1px solid #2c2820;border-radius:2px;padding:1px 0;font-size:11px;font-weight:700;color:${pvC};font-family:'Share Tech Mono',monospace"/>
            <span style="color:#4a4440;font-size:10px">/</span>
            <input type="number" value="${x.pvMax}" onchange="mesaSetCriatura('${x.id}','pvMax',this.value)" style="width:28px;text-align:center;background:transparent;border:none;border-bottom:1px solid #1c1a16;padding:1px 0;font-size:10px;color:#7a7060;font-family:'Share Tech Mono',monospace"/>
            <button onclick="mesaDeltaCriatura('${x.id}',1)" style="background:none;border:1px solid #27674944;color:#4ade80;width:20px;height:20px;border-radius:2px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent">+</button>
            <div style="display:flex;gap:2px;margin-left:4px">
              ${CONDICOES.slice(0,4).map(cd=>{

                return `<button onclick="mesaToggleCondicaoCriatura('${x.id}','${cd.v}')" title="${cd.l}" style="background:${on?cd.c+'22':'none'};border:1px solid ${on?cd.c:cd.c+'33'};color:${on?cd.c:'#4a4440'};width:20px;height:20px;border-radius:2px;font-size:10px;cursor:pointer;-webkit-tap-highlight-color:transparent">${cd.ic}</button>`;
              }).join('')}
            </div>
            <button onclick="mesaDelCriatura('${x.id}')" style="background:none;border:none;color:#302c24;font-size:14px;cursor:pointer;width:20px;height:20px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:color .15s;margin-left:2px" onmouseenter="this.style.color='#c0392b'" onmouseleave="this.style.color='#302c24'">✕</button>
          </div>`:''}
        </div>
        ${isActive?`<span style="font-size:9px;padding:2px 7px;background:#c0392b22;border:1px solid #c0392b55;border-radius:2px;color:#c0392b;text-transform:uppercase;letter-spacing:.08em;flex-shrink:0">▶ Vez</span>`:''}
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
          ${x._ini==null?`<button onclick="${isAg?`mesaRolarIniciativa('${x.id}')`:`mesaRolarIniciativaCriatura('${x.id}')`}" style="background:none;border:1px solid #b8860b44;color:#b8860b;height:26px;padding:0 8px;border-radius:2px;font-size:10px;cursor:pointer;font-family:'Share Tech Mono',monospace;-webkit-tap-highlight-color:transparent;transition:background .15s" onmouseenter="this.style.background='#b8860b18'" onmouseleave="this.style.background='none'">🎲</button>`:''}
          <input type="number" min="1" max="30" value="${x._ini??''}" placeholder="—"
            onchange="${isAg?`mesaSetIniciativa('${x.id}',this.value)`:`mesaSetIniciativaCriatura('${x.id}',this.value)`}"
            style="width:38px;text-align:center;background:#0c0b09;border:1px solid ${isActive?'#c0392b55':'#2c2820'};border-radius:2px;padding:2px 0;font-size:14px;font-weight:700;color:${isActive?'#c0392b':'#ede8dc'};font-family:'Share Tech Mono',monospace"/>
        </div>
      </div>
    </div>`;
  }

  if (todos.length === 0) {
    el.innerHTML = `<div style="color:#7a7060;font-size:12px;text-align:center;padding:8px 0">Adicione agentes ou inimigos para usar a iniciativa.</div>`;
  } else {
    el.innerHTML = sorted.map((x,i) => iniRow(x,i)).join('');
  }
  // update all ini-rodada elements (PC + mobile may both exist)
  document.querySelectorAll('#ini-rodada').forEach(rd => { rd.textContent = iniciativaRodada; });
}

  const c = camps.find(x=>x.id===viewingId);
  if (!c) return;
  (c.agentes||[]).forEach(a => { a._ini = Math.ceil(Math.random()*20); });

function mesaLimparIniciativa() {
  const c = camps.find(x=>x.id===viewingId);
  if (!c) return;
  (c.agentes||[]).forEach(a => { delete a._ini; });
  getCriaturas().forEach(cr => { delete cr._ini; });
  const sess = c.sessions_data.find(x=>x.id===mesaSessionId);
  if (sess) { sess._iniTurn = 0; sess.criaturas = []; }
  persist();
  iniciativaRodada = 1;
  renderIniciativa();
}
function mesaProximoTurno() {
  const c = camps.find(x=>x.id===viewingId);
  if (!c) return;
  const todos = [
    ...(c.agentes||[]).map(a=>({...a,_tipo:'ag'})),
    ...getCriaturas().map(cr=>({...cr,_tipo:'cr'}))
  ].filter(x => x._ini != null).sort((a,b)=>b._ini-a._ini);
  if (!todos.length) return;
  const sess = c.sessions_data.find(x=>x.id===mesaSessionId);
  if (!sess) return;
  if (sess._iniTurn == null) sess._iniTurn = 0;
  sess._iniTurn = (sess._iniTurn+1) % todos.length;
  if (sess._iniTurn === 0) iniciativaRodada++;
  persist(); renderIniciativa();
}

function saveFormState() {
  if (!formData) return;
  // info tab
  const t = v => document.getElementById(v);
  if (t('f-title'))    formData.title    = t('f-title').value;
  if (t('f-sessions')) { const n=parseInt(t('f-sessions').value)||1; syncSessionsData(n); formData.sessions=n; }
  if (t('f-status'))   formData.status   = t('f-status').value;
  if (t('f-nex'))      formData.nex      = t('f-nex').value;
  if (t('f-synopsis')) formData.synopsis = t('f-synopsis').value;
  if (t('f-notes'))    formData.notes    = t('f-notes').value;
  // antagonist
  if (t('a-name'))       formData.antagonist.name       = t('a-name').value;
  if (t('a-nature'))     formData.antagonist.nature     = t('a-nature').value;
  if (t('a-motivation')) formData.antagonist.motivation = t('a-motivation').value;
  if (t('a-power'))      formData.antagonist.power      = t('a-power').value;
}

function saveForm() {
  saveFormState();
  if (!formData.title.trim()) { showToast('Insira um título para a campanha.','err'); return; }
  if (editingId) {
    const idx = camps.findIndex(c=>c.id===editingId);
    if (idx>=0) camps[idx] = formData;
  } else {
    camps.unshift(formData);
  }
  persist();
  viewingId = formData.id;
  view = 'detail'; editingId=null; activeDetailTab='overview';
  render(); showToast('Campanha salva!');
}

function toggleEntry(bodyId, arrowId) {
  const b = document.getElementById(bodyId);
  const a = document.getElementById(arrowId);
  if (!b) return;
  const open = b.style.display !== 'none';
  b.style.display = open ? 'none' : 'block';
  if (a) a.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
}

// Fecha todos os entry-cards de um container e abre só o último
function openOnlyLast(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const cards = container.querySelectorAll('.entry-card');
  cards.forEach((card, i) => {
    const body  = card.querySelector('.entry-body');
    const arrow = card.querySelector('.entry-arrow');
    const isLast = i === cards.length - 1;
    if (body)  body.style.display = isLast ? 'block' : 'none';
    if (arrow) arrow.style.transform = isLast ? 'rotate(90deg)' : 'rotate(0deg)';
  });
}

// Fecha todas as cenas/locais/cômodos de um container e abre só o último
// rowSelector: seletor dos elementos filhos (ex: '[id^="scrow-"]')
// bodyPrefix, arrowPrefix: prefixos do id do body/arrow
// idAttr: atributo do elemento que contém o id base (ex: 'id' → strip rowPrefix)
function openOnlyLastCollapsible(containerId, rowPrefix, bodyPrefix, arrowPrefix) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const rows = container.querySelectorAll('[id^="' + rowPrefix + '"]');
  rows.forEach((row, i) => {
    const isLast = i === rows.length - 1;
    const baseId = row.id.replace(rowPrefix, '');
    const body  = document.getElementById(bodyPrefix  + baseId);
    const arrow = document.getElementById(arrowPrefix + baseId);
    if (body)  body.style.display = isLast ? 'block' : 'none';
    if (arrow) arrow.style.transform = isLast ? 'rotate(90deg)' : 'rotate(0deg)';
  });
}

function openOnlyLastScene(containerId) {
  openOnlyLastCollapsible(containerId, 'scrow-', 'scbody-', 'scarr-');
}
function openOnlyLastLoc(containerId) {
  openOnlyLastCollapsible(containerId, 'scloc-', 'sclbody-', 'sclarr-');
}
function openOnlyLastRoom(containerId) {

  const s = formData.sessions_data.find(x=>x.id===sessId);

  if (!s.linkedNpcs) s.linkedNpcs = [];
  if (checked) { if (!s.linkedNpcs.includes(itemId)) s.linkedNpcs.push(itemId); }
  else { s.linkedNpcs = s.linkedNpcs.filter(id=>id!==itemId); }

function toggleLinkedRow(type, sessId, itemId) {
  const s = formData.sessions_data.find(x=>x.id===sessId);
  if (!s) return;
  if (!s.linkedNpcs) s.linkedNpcs = [];
  const isLinked = s.linkedNpcs.includes(itemId);
  if (isLinked) s.linkedNpcs = s.linkedNpcs.filter(id=>id!==itemId);
  else s.linkedNpcs.push(itemId);
  // atualiza visual do row sem rerenderizar tudo
  const row = document.getElementById('npc-link-row-'+sessId+'-'+itemId);
  if (!row) return;
  const nowLinked = s.linkedNpcs.includes(itemId);

  row.style.borderColor = nowLinked ? '#c0392b44' : '#2c2820';

  }

function syncSessionsData(n) {
  const cur = formData.sessions_data || [];
  if (n > cur.length) {
    for (let i=cur.length; i<n; i++) cur.push(blankSess(i+1));
  } else {
    cur.splice(n);
  }
  formData.sessions_data = cur;
  formData.sessions = n;
}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 22. IMPORT / EXPORT — JSON e PDF                           │
   └─────────────────────────────────────────────────────────────┘ */
function exportJSON() {
  const blob = new Blob([JSON.stringify(camps,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'op-campanhas-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); showToast('JSON exportado!');
}
function importJSON(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const imp = JSON.parse(e.target.result);
      if (!Array.isArray(imp)) throw 0;
      const merged = [...imp, ...camps.filter(c=>!imp.find(i=>i.id===c.id))];
      camps = merged; persist(); render();
      showToast(imp.length+' campanha'+(imp.length!==1?'s':'')+' importada'+(imp.length!==1?'s':'')+'!');
    } catch { showToast('Arquivo inválido.','err'); }
  };
  r.readAsText(f); input.value='';
}

function exportPDF() {

let _toastT;
function showToast(msg, type='ok') {
  clearTimeout(_toastT);
  let el = document.getElementById('_toast');
  if (!el) { el=document.createElement('div'); el.id='_toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.style.background = type==='err' ? '#7f1d1d' : '#1a2e1a';
  el.style.border = '1px solid '+(type==='err'?'#c0392b':'#276749');
  el.style.color = type==='err' ? '#fca5a5' : '#86efac';
  el.style.display = 'block';
  _toastT = setTimeout(() => { el.style.display='none'; }, 2400);
}

// ── Drawer ───────────────────────────────────────────────────
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
  const dc = document.getElementById('drawer-count');
  if (dc) dc.textContent = camps.length || '';
  updateBackupBadge();
  applyTheme(localStorage.getItem(THEME_KEY) || 'paranormal');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}
function updateDrawerItems() {
  const editEl = document.getElementById('drawer-edit');
  const pdfEl  = document.getElementById('drawer-pdf');
  const fab    = document.getElementById('fab-btn');
  if (editEl) editEl.style.display = (view==='detail') ? 'flex' : 'none';
  if (pdfEl)  pdfEl.style.display  = (view==='detail') ? 'flex' : 'none';
  // hide FAB when in form view
  if (fab) fab.style.display = (view==='form') ? 'none' : '';
  // hide FAB when already in list with empty state
  if (fab && view==='list') fab.style.display = '';
}

/* ┌─────────────────────────────────────────────────────────────┐
   │ 24. INIT — bootstrap da aplicação                          │
   └─────────────────────────────────────────────────────────────┘ */
render();
</script>
</body>
